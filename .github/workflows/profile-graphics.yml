name: Generate profile graphics

on:
  schedule:
    - cron: "0 0 * * *" # every day at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Reports only yes/no facts (never the token, repo names or counts) as run annotations
      - name: Check token access
        env:
          TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::PROFILE_STATS_TOKEN not found - only public activity is counted"
            exit 0
          fi
          q='{"query":"{ viewer { owned: repositories(privacy: PRIVATE, ownerAffiliations: OWNER) { totalCount } shared: repositories(privacy: PRIVATE, ownerAffiliations: [COLLABORATOR, ORGANIZATION_MEMBER]) { totalCount } contributionsCollection { hasAnyRestrictedContributions } } }"}'
          r=$(curl -s -H "Authorization: bearer $TOKEN" -d "$q" https://api.github.com/graphql)
          if echo "$r" | jq -e '.data.viewer' > /dev/null; then
            owned=$(echo "$r" | jq '.data.viewer.owned.totalCount > 0')
            shared=$(echo "$r" | jq '.data.viewer.shared.totalCount > 0')
            hidden=$(echo "$r" | jq '.data.viewer.contributionsCollection.hasAnyRestrictedContributions')
            echo "::notice::Token loaded. Sees own private repos: $owned. Sees org/collaborator private repos: $shared. Has private activity the token cannot read: $hidden"
          else
            echo "::warning::Token rejected: $(echo "$r" | jq -r '.message // .errors[0].message // "unknown error"')"
          fi

      # 3D contribution calendar, languages and totals.
      # Only aggregated counts are queried — repository names and contents are never read or rendered.
      # Uses the PROFILE_STATS_TOKEN secret (read-only PAT) to include private activity,
      # falling back to the default token (public activity only) when it is not set.
      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Collect outputs
        run: |
          mkdir -p out
          cp -r profile-3d-contrib out/
          ls -R out

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
